# SSO deployment - OCM with LemonLDAP-NG OIDC Authentication
#
# Use this file on its own: stacked on docker-compose.yml, OCM would also be
# published on port 3001, around the relay.
#
# It runs two containers:
#   - lemonldap: the LemonLDAP-NG portal, from yadd/lemonldap-ng-portal, an
#     image without the Manager. It is the OIDC provider, on
#     auth.${SSO_DOMAIN}, and serves ocm.${SSO_DOMAIN} through its built-in
#     reverse proxy (RELAY), which passes every request on to OCM. It is the
#     only container to publish a port: 80. No external proxy (Traefik) needed.
#   - ocm: OCM, which signs users in itself, with OIDC. It publishes no port.
#
# LemonLDAP runs its default configuration, whose Demo authentication accepts
# the accounts dwho, rtyler and msmith, with their login as password: replace
# it before any real use. The files of demo/sso, mounted on /over, override
# that configuration, one key per file. They register OCM as relying party
# for the defaults of this file (see demo/README.md for another domain):
#   - Client ID: ocm-dashboard, client secret: change-me
#   - Redirect URI: http://ocm.localhost/auth/callback
#   - Post-logout redirect URI: http://ocm.localhost
#   - Back-channel logout URI: http://ocm.localhost/logout/backchannel
#
# BUILD & RUN:
#   docker compose -f docker-compose.sso.yml build
#   docker compose -f docker-compose.sso.yml up -d
#
# ENVIRONMENT VARIABLES (create .env file or export), all optional:
#   SSO_DOMAIN=localhost           # Portal on auth.${SSO_DOMAIN}, dashboard on ocm.${SSO_DOMAIN}
#   OIDC_CLIENT_SECRET=change-me   # Must equal the client secret of demo/sso
#   SESSION_SECRET=change-me-in-production
#                                  # OCM turns OIDC on only when it is set, but neither
#                                  # encrypts nor signs with it: its sessions are random
#                                  # ids stored in its database
#
# ACCESS:
#   Dashboard: http://ocm.${SSO_DOMAIN}/
#   SSO Portal: http://auth.${SSO_DOMAIN}/

services:
  ocm:
    # Option 1: Build from local Dockerfile (default)
    build:
      context: .
      dockerfile: Dockerfile
    # Option 2: Use pre-built image (comment build section above, uncomment below)
    # image: mmaudet/ovh-cost-manager:latest
    container_name: ovh-cost-manager
    restart: unless-stopped
    volumes:
      - ocm-data:/data
      - ./config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Database lives in a dedicated dir mounted as a volume, kept separate
      # from the application code under /app/data (which ships in the image).
      - DATA_DIR=/data
      - TRUST_PROXY=true
      # Hosts the server answers, against DNS rebinding; empty: any host
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      # OIDC Configuration
      - OIDC_ENABLED=true
      - OIDC_ISSUER=http://auth.${SSO_DOMAIN:-localhost}
      - OIDC_CLIENT_ID=ocm-dashboard
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-change-me}
      - OIDC_BASE_URL=http://ocm.${SSO_DOMAIN:-localhost}
      - OIDC_SCOPES=openid,profile,email
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
    networks:
      - ocm-network
    depends_on:
      - lemonldap

  # LemonLDAP-NG - SSO Portal & OIDC Provider
  # Using RELAY feature to serve OCM behind the portal
  lemonldap:
    image: yadd/lemonldap-ng-portal:latest
    container_name: lemonldap
    restart: unless-stopped
    environment:
      - SSODOMAIN=${SSO_DOMAIN:-auth.localhost}
      - PORTAL=http://auth.${SSO_DOMAIN:-localhost}
      - LOGLEVEL=notice
      # RELAY: Built-in nginx reverse proxy
      - RELAY=ocm.${SSO_DOMAIN:-localhost}=http://ocm:3001/
      
    volumes:
      - lemonldap-conf:/var/lib/lemonldap-ng/conf
      - lemonldap-sessions:/var/lib/lemonldap-ng/sessions
      - ./demo/sso:/over
    ports:
      - "80:80"
    networks:
      ocm-network:
        aliases:
          - auth.${SSO_DOMAIN:-localhost}
          - manager.${SSO_DOMAIN:-localhost}
          - ocm.${SSO_DOMAIN:-localhost}

volumes:
  ocm-data:
    name: ocm-data
  lemonldap-conf:
    name: lemonldap-conf
  lemonldap-sessions:
    name: lemonldap-sessions

networks:
  ocm-network:
    name: ocm-network
    driver: bridge
