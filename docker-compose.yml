# Base configuration - OCM without SSO
#
# BUILD OPTIONS:
#   1. Build locally:
#      docker-compose build
#      docker-compose up -d
#
#   2. Use pre-built image from Docker Hub:
#      Comment out "build:" section and uncomment "image:" line below
#      docker-compose up -d
#
# For SSO deployment, use docker-compose.sso.yml on its own (see its header):
#   docker compose -f docker-compose.sso.yml up -d
# Do not stack both files: OCM would also be published on port 3001, around
# the SSO relay, and the TRUST_PROXY of the SSO file would then let any client
# choose the address that rate limiting sees.

services:
  ocm:
    # Option 1: Build from local Dockerfile (default)
    build:
      context: .
      dockerfile: Dockerfile
    # Option 2: Use pre-built image (comment build section above, uncomment below)
    # image: mmaudet/ovh-cost-manager:latest
    container_name: ovh-cost-manager
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - AUTH_REQUIRED=${AUTH_REQUIRED:-false}
      # OIDC sign-in, off by default; empty: the auth section of config.json.
      # OIDC_SCOPES is not passed, as empty it would be read as one blank
      # scope: the scopes come from config.json in this stack
      - OIDC_ENABLED=${OIDC_ENABLED:-}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_BASE_URL=${OIDC_BASE_URL:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      # Hosts the server answers, against DNS rebinding; empty: any host
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      # Other sites that may call the API (CORS); empty: allowedOrigins of
      # config.json, or none
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # The proxies OCM trusts, and rate limiting; empty: the rateLimit
      # section of config.json, or the server's defaults
      - TRUST_PROXY=${TRUST_PROXY:-}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-}
      - RATE_LIMIT_API_MAX=${RATE_LIMIT_API_MAX:-}
      - RATE_LIMIT_API_WINDOW_MS=${RATE_LIMIT_API_WINDOW_MS:-}
      - RATE_LIMIT_AUTH_MAX=${RATE_LIMIT_AUTH_MAX:-}
      - RATE_LIMIT_AUTH_WINDOW_MS=${RATE_LIMIT_AUTH_WINDOW_MS:-}
      - PORT=3001
      # Database lives in a dedicated dir mounted as a volume, kept separate
      # from the application code under /app/data (which ships in the image).
      - DATA_DIR=/data
      - IMPORT_ENABLED=${IMPORT_ENABLED:-true}
      - IMPORT_INTERVAL=${IMPORT_INTERVAL:-86400}
      - IMPORT_FLAGS=${IMPORT_FLAGS:---all}
    ports:
      - "${OCM_PORT:-3001}:3001"
    volumes:
      - ocm-data:/data
      - ./config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

volumes:
  ocm-data:
    name: ocm-data
